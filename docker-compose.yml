name: devtools-br

services:
  rest:
    build:
      context: .
    image: devtools-br:local
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    command: ["npm", "run", "start:rest"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/encoders/md5',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:'abc'})}).then(r=>r.ok?r.json():Promise.reject()).then(b=>process.exit(b.md5==='900150983cd24fb0d6963f7d28e17f72'?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  mcp-http:
    image: devtools-br:local
    build:
      context: .
    environment:
      NODE_ENV: production
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3001
    ports:
      - "3001:3001"
    command: ["npm", "run", "start:mcp:http"]
    restart: unless-stopped
